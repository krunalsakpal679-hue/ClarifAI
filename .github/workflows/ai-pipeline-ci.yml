name: AI Microservice CI

on:
  push:
    branches: [ develop, main, "feature/*" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test-and-scan:
    name: Pytest, AI Safety, Audit & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System OCR Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/fastapi-ai/requirements.txt
          pip install pytest pytest-asyncio pip-audit

      - name: Run FastAPI AI Pytest Suite & AI Guardrails
        working-directory: backend/fastapi-ai
        env:
          PYTHONPATH: "."
          ENVIRONMENT: "test"
          GROQ_API_KEY: "gsk_ci_placeholder_key_for_testing_only"
          QDRANT_URL: "http://localhost:6333"
        run: |
          set -o pipefail
          pytest tests/ -v 2>&1 | tee /tmp/pytest.log || {
            ERR=$(tail -n 25 /tmp/pytest.log | tr '\n' ' ')
            echo "::error::FastAPI Pytest Failure: $ERR"
            exit 1
          }

      - name: Run Dependency Audit (pip-audit)
        run: |
          python -m pip_audit -r backend/fastapi-ai/requirements.txt || true

      - name: Secret Scan (Workspace Source Audit)
        run: |
          SECRET_MATCHES=$(grep -rE "(GROQ_API_KEY|QDRANT_API_KEY)\s*=\s*['\"]gsk_[a-zA-Z0-9_\-]{24,}['\"]" backend/fastapi-ai/app || true)
          if [ -n "$SECRET_MATCHES" ]; then
            echo "::error::Hardcoded secret assignment detected in source code:"
            echo "$SECRET_MATCHES"
            exit 1
          else
            echo "No hardcoded secret assignments found in source code."
          fi

  docker-build:
    name: Fresh Docker Build & FastAPI Container Health Test
    runs-on: ubuntu-latest
    needs: test-and-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fresh Docker Build
        uses: docker/build-push-action@v5
        with:
          context: backend/fastapi-ai
          file: backend/fastapi-ai/Dockerfile
          load: true
          tags: clarifai-fastapi-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Execution Inside Docker
        run: |
          set -x
          echo "=== Available Docker Images ==="
          docker images
          echo "=== Starting FastAPI Container ==="
          docker run -d --name test_ai -p 18000:8000 -e GROQ_API_KEY="gsk_ci_test" clarifai-fastapi-ai:ci
          sleep 5
          echo "=== Container Status ==="
          docker ps -a --filter name=test_ai
          echo "=== Container Logs (Initial Startup) ==="
          docker logs test_ai || true
          echo "=== In-Container Healthcheck ==="
          docker exec test_ai curl -f -sS http://127.0.0.1:8000/health || {
            echo "::error::In-container healthcheck failed"
            docker logs test_ai
            exit 1
          }
          echo "=== Host-Level Healthcheck ==="
          curl -f -sS --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:18000/health || {
            echo "::error::Host healthcheck failed"
            docker logs test_ai
            exit 1
          }
          docker stop test_ai

