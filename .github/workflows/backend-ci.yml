name: Backend Django API CI

on:
  push:
    branches: [ develop, main, "feature/*" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test-and-scan:
    name: Test, Audit & Security Scan
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install System Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-freefont-ttf

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/django-api/requirements.txt
          pip install pip-audit

      - name: Run Test Suite
        working-directory: backend/django-api
        env:
          PYTHONPATH: "."
          DJANGO_SETTINGS_MODULE: "config.settings.test"
          SECRET_KEY: "ci-insecure-test-key-never-use-in-production"
          DEBUG: "True"
          CELERY_BROKER_URL: "memory://"
        run: |
          set -o pipefail
          python manage.py test --no-input -v 2 2>&1 | tee /tmp/test.log || {
            ERR=$(tail -n 25 /tmp/test.log | tr '\n' ' ')
            echo "::error::Django Test Failure: $ERR"
            exit 1
          }

      - name: Run Dependency Audit (pip-audit)
        run: |
          python -m pip_audit -r backend/django-api/requirements.txt || true

      - name: Secret Scan (Workspace Audit)
        run: |
          SECRET_MATCHES=$(grep -rE "(AWS_SECRET_ACCESS_KEY|DATABASE_PASSWORD)\s*=\s*['\"][a-zA-Z0-9_\-!@#$%^&*()+=]{16,}['\"]" backend/ || true)
          if [ -n "$SECRET_MATCHES" ]; then
            echo "::error::Hardcoded secret assignment detected in workspace:"
            echo "$SECRET_MATCHES"
            exit 1
          else
            echo "No hardcoded secret assignments found in workspace."
          fi

  docker-build:
    name: Fresh Docker Build & Container Health Test
    runs-on: ubuntu-latest
    needs: test-and-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fresh Docker Build
        uses: docker/build-push-action@v5
        with:
          context: backend/django-api
          file: backend/django-api/Dockerfile
          load: true
          tags: clarifai-django-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Execution Inside Docker
        run: |
          set -x
          echo "=== Available Docker Images ==="
          docker images
          echo "=== Starting Django Container ==="
          docker run -d --name test_api -p 18000:8000 -e SECRET_KEY="ci-test-key" clarifai-django-api:ci
          sleep 10
          echo "=== Container Status ==="
          docker ps -a --filter name=test_api
          echo "=== Container Logs (Initial Startup) ==="
          docker logs test_api || true
          echo "=== In-Container Healthcheck ==="
          docker exec test_api curl -f -sS --retry 15 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/api/health/ || {
            echo "::error::In-container healthcheck failed"
            docker logs test_api
            exit 1
          }
          echo "=== Host-Level Healthcheck ==="
          curl -f -sS --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:18000/api/health/ || {
            echo "::error::Host healthcheck failed"
            docker logs test_api
            exit 1
          }
          docker stop test_api
