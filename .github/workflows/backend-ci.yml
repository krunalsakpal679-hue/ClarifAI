name: Backend Django API CI

on:
  push:
    branches: [ develop, main, "feature/backend-*" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test-and-scan:
    name: Test, Audit & Security Scan
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/django-api/requirements.txt
          pip install pip-audit

      - name: Run Test Suite
        working-directory: backend/django-api
        env:
          SECRET_KEY: "ci-insecure-test-key-never-use-in-production"
          DEBUG: "True"
          CELERY_BROKER_URL: "redis://localhost:6379/0"
        run: |
          python manage.py test --settings=config.settings.test

      - name: Run Dependency Audit (pip-audit)
        run: |
          python -m pip_audit -r backend/django-api/requirements.txt

      - name: Secret Scan (Git History Audit)
        run: |
          git log -p | grep -iE "(AWS_SECRET|JWT_SECRET_KEY|DATABASE_PASSWORD=production)" && exit 1 || echo "No plain secrets found in commit history."

  docker-build:
    name: Fresh Docker Build & Container Health Test
    runs-on: ubuntu-latest
    needs: test-and-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fresh Docker Build
        uses: docker/build-push-action@v5
        with:
          context: backend/django-api
          file: backend/django-api/Dockerfile
          load: true
          tags: clarifai-django-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Execution Inside Docker
        run: |
          docker run -d --name test_api -p 8000:8000 -e SECRET_KEY="ci-test-key" clarifai-django-api:ci
          sleep 5
          curl --fail http://localhost:8000/api/health/ || exit 1
          docker stop test_api
