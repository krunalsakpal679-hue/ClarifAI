name: Full Stack Integration CI

on:
  push:
    branches: [ develop, main, "feature/*" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  full-system-e2e:
    name: Full System E2E & Cross-Service Integration Suite
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install System Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-freefont-ttf

      - name: Install Django Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/django-api/requirements.txt

      - name: Run Full E2E & Integration Regression Suite
        working-directory: backend/django-api
        env:
          PYTHONPATH: "."
          DJANGO_SETTINGS_MODULE: "config.settings.test"
          SECRET_KEY: "ci-insecure-test-key-never-use-in-production"
          DEBUG: "True"
          CELERY_BROKER_URL: "memory://"
        run: |
          set -o pipefail
          python manage.py test --no-input -v 2 tests.test_e2e_05_to_15_document_pipeline tests.test_e2e_16_to_19_analysis_and_clauses tests.test_e2e_20_to_22_chatbot tests.test_e2e_23_to_24_comparison tests.test_e2e_25_to_26_translation tests.test_e2e_27_to_29_reports tests.test_e2e_30_to_31_dashboard_history tests.test_e2e_32_to_33_deletion_qdrant tests.test_e2e_34_security_matrix tests.test_e2e_37_to_41_failure_recovery tests.test_e2e_ai_safety_and_guardrails tests.test_e2e_user_journey tests.test_correlation_id 2>&1 | tee /tmp/integration.log || {
            ERR=$(tail -n 25 /tmp/integration.log | tr '\n' ' ')
            echo "::error::Integration Test Failure: $ERR"
            exit 1
          }
